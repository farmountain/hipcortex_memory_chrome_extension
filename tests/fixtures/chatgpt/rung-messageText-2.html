<!doctype html>
<!--
  `messageText` rung 2: every turn uses the pre-formatted block, so `.markdown` and
  `[data-message-content]` are both absent and the deepest rung is the one that resolves.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redacted conversation</title>
  </head>
  <body>
    <main id="conversation-root">
      <div data-testid="conversation-turn-0" data-message-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-1</div>
      </div>
      <div data-testid="conversation-turn-1" data-message-author-role="assistant">
        <div class="whitespace-pre-wrap">REDACTED-ASSISTANT-1</div>
      </div>
      <div data-testid="conversation-turn-2" data-message-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-2</div>
      </div>
    </main>
    <form class="composer"><textarea placeholder="Message ChatGPT"></textarea></form>
  </body>
</html>
