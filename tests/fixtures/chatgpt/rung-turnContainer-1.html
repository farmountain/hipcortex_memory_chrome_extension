<!doctype html>
<!--
  `turnContainer` rung 1: turns are `<article data-turn>` and no `[data-testid^="conversation-turn-"]`
  exists anywhere in the document.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redacted conversation</title>
  </head>
  <body>
    <main id="conversation-root">
      <article data-turn="1" data-message-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-1</div>
      </article>
      <article data-turn="2" data-message-author-role="assistant">
        <div class="markdown"><p>REDACTED-ASSISTANT-1</p></div>
      </article>
      <article data-turn="3" data-message-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-2</div>
      </article>
    </main>
    <form class="composer"><textarea placeholder="Message ChatGPT"></textarea></form>
  </body>
</html>
