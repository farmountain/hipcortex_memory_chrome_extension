<!doctype html>
<!--
  The canonical ChatGPT-shaped conversation fixture.

  Redacted and synthetic. It reproduces the *shape* the adapter's ladders target — an app shell,
  a composer, test-id turn containers carrying `data-message-author-role`, assistant text under
  `.markdown` and user text under `.whitespace-pre-wrap`.

  It doubles as the rung-0 fixture for `conversationRoot`, `turnContainer` and `roleSignal`. Note
  that its deepest used `messageText` rung is 2, not 0: the user turns cannot be read by the
  assistant selector, which is why `rungs.messageText` records the deepest rung any turn needed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redacted conversation</title>
  </head>
  <body>
    <main id="conversation-root">
      <div data-testid="conversation-turn-0" data-message-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-1</div>
      </div>
      <div data-testid="conversation-turn-1" data-message-author-role="assistant">
        <div class="markdown"><p>REDACTED-ASSISTANT-1</p></div>
      </div>
      <div data-testid="conversation-turn-2" data-message-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-2</div>
      </div>
      <div data-testid="conversation-turn-3" data-message-author-role="assistant">
        <div class="markdown"><p>REDACTED-ASSISTANT-2</p></div>
      </div>
    </main>
    <form class="composer"><textarea placeholder="Message ChatGPT"></textarea></form>
  </body>
</html>
