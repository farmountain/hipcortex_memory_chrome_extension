<!doctype html>
<!--
  An image-only turn. The provider puts the upload inside the message body, not in the surrounding
  shell, so this is message content with no text. Treating it as "no text" would make the cardinality
  check reject a perfectly good conversation; recording it as an attachment is the honest read.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redacted conversation</title>
  </head>
  <body>
    <main id="conversation-root">
      <div data-testid="conversation-turn-0" data-message-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-1</div>
      </div>
      <div data-testid="conversation-turn-1" data-message-author-role="assistant">
        <div class="markdown"><img src="https://chatgpt.com/backend-api/estuary/content?id=redacted" alt="" /></div>
      </div>
      <div data-testid="conversation-turn-2" data-message-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-2</div>
      </div>
    </main>
    <form class="composer"><textarea placeholder="Message ChatGPT"></textarea></form>
  </body>
</html>
