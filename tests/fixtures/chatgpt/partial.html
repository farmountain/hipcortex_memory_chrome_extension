<!doctype html>
<!--
  Degraded: four turn containers, but turn 2 has an empty text node. Producing a three-message
  conversation would be a *partial success*, which is the one outcome G8.7 forbids outright — the
  core would retain a conversation that is silently missing a turn.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redacted conversation</title>
  </head>
  <body>
    <main id="conversation-root">
      <div data-testid="conversation-turn-0" data-message-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-1</div>
      </div>
      <div data-testid="conversation-turn-1" data-message-author-role="assistant">
        <div class="markdown"><p>REDACTED-ASSISTANT-1</p></div>
      </div>
      <div data-testid="conversation-turn-2" data-message-author-role="user">
        <div class="whitespace-pre-wrap"></div>
      </div>
      <div data-testid="conversation-turn-3" data-message-author-role="assistant">
        <div class="markdown"><p>REDACTED-ASSISTANT-2</p></div>
      </div>
    </main>
    <form class="composer"><textarea placeholder="Message ChatGPT"></textarea></form>
  </body>
</html>
