<!doctype html>
<!--
  `roleSignal` rung 1: the turn carries `data-author-role` and never `data-message-author-role`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redacted conversation</title>
  </head>
  <body>
    <main id="conversation-root">
      <div data-testid="conversation-turn-0" data-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-1</div>
      </div>
      <div data-testid="conversation-turn-1" data-author-role="assistant">
        <div class="markdown"><p>REDACTED-ASSISTANT-1</p></div>
      </div>
      <div data-testid="conversation-turn-2" data-author-role="user">
        <div class="whitespace-pre-wrap">REDACTED-USER-2</div>
      </div>
    </main>
    <form class="composer"><textarea placeholder="Message ChatGPT"></textarea></form>
  </body>
</html>
