<!doctype html>
<!--
  The canonical Grok conversation: four turns, two roles, and both `messageText` rungs in use
  (rendered markdown at rung 0, the user bubble at rung 1). Shaped to the adapter's declared ladders
  — it is not a recording of the live page, and the adapter's `verifiedAt` is the only claim of
  freshness.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redacted conversation</title>
  </head>
  <body>
    <main>
      <div data-testid="conversation">
        <div data-testid="conversation-turn" data-message-author-role="user">
          <div class="message-bubble">REDACTED-USER-1</div>
        </div>
        <div data-testid="conversation-turn" data-message-author-role="assistant">
          <div class="response-content-markdown"><p>REDACTED-ASSISTANT-1</p></div>
        </div>
        <div data-testid="conversation-turn" data-message-author-role="user">
          <div class="message-bubble">REDACTED-USER-2</div>
        </div>
        <div data-testid="conversation-turn" data-message-author-role="assistant">
          <div class="response-content-markdown"><p>REDACTED-ASSISTANT-2</p></div>
        </div>
      </div>
    </main>
    <div class="composer"><textarea></textarea></div>
  </body>
</html>
