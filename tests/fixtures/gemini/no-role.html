<!doctype html>
<!--
  Degraded: the turns are present and the text is readable, but nothing in the document carries a
  role signal. The adapter must refuse with `NO_ROLE_SIGNAL` rather than infer the role from the
  element name — an inferred role is a wrong capture that no later layer can detect.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redacted conversation</title>
  </head>
  <body>
    <main>
      <conversation-container>
        <user-query>
          <div class="query-text">REDACTED-USER-1</div>
        </user-query>
        <model-response>
          <div class="markdown"><p>REDACTED-ASSISTANT-1</p></div>
        </model-response>
        <user-query>
          <div class="query-text">REDACTED-USER-2</div>
        </user-query>
      </conversation-container>
    </main>
    <div class="composer"><div contenteditable="true"></div></div>
  </body>
</html>
