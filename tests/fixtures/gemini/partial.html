<!doctype html>
<!--
  Degraded: four turn containers, but the third has an empty query block. Producing a three-message
  conversation would be a *partial success*, which is the one outcome G8.7 forbids outright — the
  core would retain a conversation that is silently missing a turn.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redacted conversation</title>
  </head>
  <body>
    <main>
      <conversation-container>
        <user-query data-message-author-role="user">
          <div class="query-text">REDACTED-USER-1</div>
        </user-query>
        <model-response data-message-author-role="assistant">
          <div class="markdown"><p>REDACTED-ASSISTANT-1</p></div>
        </model-response>
        <user-query data-message-author-role="user">
          <div class="query-text"></div>
        </user-query>
        <model-response data-message-author-role="assistant">
          <div class="markdown"><p>REDACTED-ASSISTANT-2</p></div>
        </model-response>
      </conversation-container>
    </main>
    <div class="composer"><div contenteditable="true"></div></div>
  </body>
</html>
