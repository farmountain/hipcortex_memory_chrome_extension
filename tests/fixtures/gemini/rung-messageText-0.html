<!doctype html>
<!--
  Every message text reaches through the first rung of the `messageText` ladder. The reported rung is
  the deepest one used by any message, so a fixture is the only way to observe rung 0 at all: in the
  canonical conversation the user turns already fall through to rung 1.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redacted conversation</title>
  </head>
  <body>
    <main>
      <conversation-container>
        <user-query data-message-author-role="user">
          <div class="markdown"><p>REDACTED-USER-1</p></div>
        </user-query>
        <model-response data-message-author-role="assistant">
          <div class="markdown"><p>REDACTED-ASSISTANT-1</p></div>
        </model-response>
        <user-query data-message-author-role="user">
          <div class="markdown"><p>REDACTED-USER-2</p></div>
        </user-query>
        <model-response data-message-author-role="assistant">
          <div class="markdown"><p>REDACTED-ASSISTANT-2</p></div>
        </model-response>
      </conversation-container>
    </main>
    <div class="composer"><div contenteditable="true"></div></div>
  </body>
</html>
