<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HipCortex Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>🧠 HipCortex Settings</h1>
      <p class="subtitle">Configure connection to your local or managed memory engine</p>
    </header>

    <form id="settings-form">
      <div class="field">
        <label for="apiUrl">API URL</label>
        <input id="apiUrl" type="url" placeholder="http://127.0.0.1:3030" required />
        <p class="hint">Local default: http://127.0.0.1:3030 · Managed: https://hipcortex.fly.dev</p>
      </div>

      <div class="field">
        <label for="apiKey">API Key (optional)</label>
        <input id="apiKey" type="password" placeholder="sk-… or leave empty for local" />
      </div>

      <div class="field">
        <label for="defaultActor">Default Actor</label>
        <input id="defaultActor" type="text" placeholder="browser-user" />
        <p class="hint">Identity used when adding memories from the extension</p>
      </div>

      <div class="field checkbox">
        <input id="autoCapture" type="checkbox" />
        <label for="autoCapture">Auto-capture page visits (experimental)</label>
      </div>

      <div class="field checkbox">
        <input id="injectIntoAiChats" type="checkbox" />
        <label for="injectIntoAiChats">Offer context injection on AI chat sites</label>
      </div>

      <div class="field checkbox">
        <input id="headroomMode" type="checkbox" checked />
        <label for="headroomMode">Prefer Headroom / lean context mode</label>
      </div>

      <div class="actions">
        <button type="submit" class="primary">Save Settings</button>
        <button type="button" id="btn-test" class="secondary">Test Connection</button>
      </div>
    </form>

    <div id="status" class="status"></div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
