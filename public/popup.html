<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HipCortex</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🧠</div>
      <div class="title-block">
        <h1>HipCortex</h1>
        <span id="status-badge" class="badge unknown">…</span>
      </div>
    </header>

    <section class="quick-add">
      <label for="memory-text">Capture memory</label>
      <textarea id="memory-text" rows="3" placeholder="Decision, fact, or observation…"></textarea>
      <div class="row">
        <input id="memory-action" type="text" placeholder="action (e.g. decided)" value="noted" />
        <button id="btn-add" class="primary">Add</button>
      </div>
    </section>

    <section class="search">
      <label for="search-query">Search</label>
      <div class="row">
        <input id="search-query" type="text" placeholder="Query causal graph…" />
        <button id="btn-search" class="secondary">Go</button>
      </div>
      <div id="search-results" class="results"></div>
    </section>

    <footer>
      <button id="btn-sidepanel" class="link">Open Side Panel</button>
      <button id="btn-options" class="link">Settings</button>
    </footer>
    <div id="toast" class="toast hidden"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
