<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HipCortex Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="panel">
    <header>
      <h1>🧠 HipCortex</h1>
      <span id="status" class="badge unknown">…</span>
    </header>

    <div id="egress-banner" class="egress-banner hidden" role="status"></div>

    <div class="search-bar">
      <input id="query" type="text" placeholder="Search captured memory…" />
      <button id="btn-search">Search</button>
    </div>

    <div class="search-scope">
      <select id="search-scope" title="Where the search runs">
        <option value="local" selected>Captured conversations (offline)</option>
        <option value="core">Runtime (semantic)</option>
      </select>
    </div>

    <div id="results" class="results"></div>

    <section class="add-section">
      <h2>Quick Capture</h2>
      <textarea id="capture" rows="2" placeholder="What did you decide or learn?"></textarea>
      <button id="btn-capture" class="primary">Store Memory</button>
      <p id="capture-note" class="capture-note hidden"></p>
    </section>
  </div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
